                        { id: 1, text: "你只负责记录？", reply: "倾听也是一种力量。在这个喧嚣的世界，愿意安静下来记录女性智慧的人太少了。我觉得我很荣幸。" },
                        { id: 2, text: "你不觉得无聊？", reply: "看着历史在眼前流过，怎么会无聊？我是第一个知道结局的人。这种安静的观察让我觉得……我很富有。" },
                        { id: 3, text: "她们在意你吗？", reply: "她们信任我的笔。这就够了。不需要聚光灯，灯塔的底座从不发光，但它举起了光。" }
                    ]
                }
            },
            en: {
                'b1': {
                    start: "Look at the feathers on the ground. Each one is a vow they made on stage. The boys are responsible for shining, and I am responsible for weaving that shine into a floor we can walk on.",
                    options: [
                        { id: 1, text: "Don't you find sweeping annoying?", reply: "Annoying? Perhaps. But if no one cleans up this beautiful nonsense, our nest would have collapsed long ago. I appreciate their effort, as long as they don't expect beauty alone to feed the children." },
                        { id: 2, text: "Why watch them perform?", reply: "Because it is a contract. They display vulnerability and beauty; I display assessment and burden. In this nation, the one being watched is surrendering power, and the watcher, holding that power, must be benevolent." },
                        { id: 3, text: "What do you value most?", reply: "Not who flies the highest, but who lands the steadiest. Only when the wind stops can you see who truly loves this home and who just loves the show." }
                    ]
                },
                'b2': {
                    start: "I spent three hours mixing this color. The Matriarch said last season's blue was too aggressive, so I added some greyscale. Does this look 'reliable' to you, or just 'vain'?",
                    options: [
                        { id: 1, text: "I think it's beautiful.", reply: "Thank you. But in Plumaria, beauty without function is waste. I hope my beauty makes her feel... that I am a partner who can weather the storm with her." },
                        { id: 2, text: "Why care so much about their opinion?", reply: "Because their eyes are rulers. They can see if the muscle under the feather is taut. Listening to their critique makes me better. It's not submission; it's evolution." },
                        { id: 3, text: "What if you aren't chosen?", reply: "Then I'll teach the chicks to fly. If I can't be the protagonist, being a good audience is also a contribution. Besides, this color makes me happy too." }
                    ]
                },
                'b3': {
                    start: "Tea? That boy who just came down is crying loudly. He thought if his heart was sincere enough, the wind would change. Sadly, love, like physics, doesn't run on sentiment.",
                    options: [
                        { id: 1, text: "Will you comfort him?", reply: "I won't lie to him. I'll tell him: 'Your feathers are beautiful, just not for this tree.' Kindness between women isn't lying; it's telling the truth and then pouring hot tea." },
                        { id: 2, text: "Is it always this cruel?", reply: "Choice is always cruel. But not choosing is crueler—that is irresponsible to everyone. We select so the next generation has better wings. It's not personal." },
                        { id: 3, text: "What about you?", reply: "Me? I'm the one dimming the lights backstage. So the winners aren't too proud, and the losers aren't too embarrassed. That's a form of 'care', isn't it?" }
                    ]
                },
                'h1': {
                    start: "You're standing in a blind spot. If there's an attack, you'll be the first breach. Move three steps left. We don't protect each other with hugs; we protect with positioning.",
                    options: [
                        { id: 1, text: "That's too strict.", reply: "Relaxation is a privilege for the dead. In this nation, 'love' means I won't allow you to die from a mistake. My strictness is your survival guarantee." },
                        { id: 2, text: "Does everyone listen to you?", reply: "They listen to 'logic'. If ignoring me improved efficiency by 1%, I'd shut up and step aside immediately. There are no queens here, only optimal solutions." },
                        { id: 3, text: "Aren't you tired?", reply: "The system doesn't need the emotion of 'tired'. It needs lubricant. As long as the defense line is intact, I don't feel tired." }
                    ]
                },
                'h2': {
                    start: "...Pressure dropped. Storm in ten minutes. My knees knew before the radar. Do you need cover?",
                    options: [
                        { id: 1, text: "How did you know?", reply: "The body is the best sensor. Many ignore bodily noise, but in Riftmark, we train the body into a precision instrument. Pain is a signal, not torture." },
                        { id: 2, text: "You seem cold.", reply: "Because excess emotion interferes with signal reception. I'm not uncaring; I'm calculating the joules needed to drag you to safety. That is my way of caring." },
                        { id: 3, text: "What is your gender?", reply: "I am a 'Warrior', I am an 'Early Warning System'. In the face of survival, gender labels are redundant decorations. You should throw yours away too; you'll run faster." }
                    ]
                },
                'h3': {
                    start: "Shh. Don't speak. Look at the Commander, she's adjusting her breathing. I learned one thing: when women are silent, they are usually making a massive decision. I just need to hand over the ammo.",
                    options: [
                        { id: 1, text: "Do you feel insignificant?", reply: "No. A gear is part of the machine. I don't need to be the brain; being a flexible hand is fulfilling. They steer, and I ensure the direction is safe." },
                        { id: 2, text: "Are you afraid of them?", reply: "It's reverence. They bear the pressure of decision-making—the heaviest burden. I respect anyone who dares to be responsible for the outcome." },
                        { id: 3, text: "Ever thought of leaving?", reply: "To where? Places full of lies? It's cold and hard here, but it's real. As long as I am useful, I have dignity. That is fair." }
                    ]
                },
                'o1': {
                    start: "Young ones want to forget pain, thinking it a burden. But I keep this scar because it records the tsunami fifty years ago. Forget it, and my children will drown in the same waters.",
                    options: [
                        { id: 1, text: "Memory is too heavy.", reply: "In this nation, memory is buoyancy. It keeps us from sinking. As an elder, my duty is to carry this weight so you can swim a bit lighter." },
                        { id: 2, text: "Do you hold grudges?", reply: "I remember harm to avoid repeating it, but that isn't hate. Hate consumes energy; memory stores it. We are pragmatic." },
                        { id: 3, text: "What about the future?", reply: "The future is just an echo of the past. Only those who hear the past clearly can see the future. Come, sit. Let me tell you the story of this reef." }
                    ]
                },
                'o2': {
                    start: "I dreamt I recited the genealogy wrong last night. Woke up in a cold sweat. If I break the chain, a thousand years of wisdom is lost. Do you understand that fear?",
                    options: [
                        { id: 1, text: "Why not write it down?", reply: "Paper rots in water, stone wears smooth. Only what is carved in the brain flows with the blood. This is how we love the world—by remembering it." },
                        { id: 2, text: "You can rest.", reply: "Grandmother Mu La is sixty and still remembering. She hasn't rested; how dare I? But I'm learning to weave stories into songs. It's less heavy when sung." },
                        { id: 3, text: "Is it worth it?", reply: "When you see a calf avoid a trap you remembered, you feel it is all worth it. We are vessels of time. It is sacred." }
                    ]
                },
                'o3': {
                    start: "The Matriarch spoke for four hours today. My hand cramped twice, but I didn't stop. Her words might not be understood for fifty years; my task is ensuring they are still there when that time comes.",
                    options: [
                        { id: 1, text: "You only record?", reply: "Listening is also a power. In this noisy world, few are willing to quietly record female wisdom. I feel honored." },
                        { id: 2, text: "Isn't it boring?", reply: "Watching history flow before my eyes? How could it be? I am the first to know the ending. This quiet observation makes me feel... wealthy." },
                        { id: 3, text: "Do they care about you?", reply: "They trust my pen. That is enough. No need for a spotlight; the base of the lighthouse never shines, but it holds up the light." }
                    ]
                }
            }
        };

              { id: 4, topic: '关于增加“气味记忆”课程的提案', status: '新议案', details: `会议时间：2056年6月20日\n提案人：忆行国长老代表\n\n[09:00] 长老：“现在的幼崽过度依赖视觉，正在丧失对洋流气味的辨识力。记忆是生存的根本，建议在幼教阶段强制加入气味图谱训练。”` },

              { id: 6, topic: '关于羽择国颜料分配的抗议', status: '已回应', details: `会议时间：2056年6月22日\n\n[14:00] 部分年轻雄性抗议蓝色颜料分配不足，影响求偶展示。\n[14:30] 裁决：颜料优先供应给承担防御任务的伪装者。但鼓励大家使用自然脱落的花瓣和羽毛进行装饰。真正的美来自于对自然的适应，而非对资源的消耗。` }
            ],
            routes: [
              '输送高能营养液', '交换抚育经验数据', '请求防御力量支援', '运送情绪安抚香料',
              '幼体临时寄养', '跨物种基因库比对', '老年个体临终关怀', '紧急医疗队调动',
              '分享季风气候预警', '支援巢穴修补材料', '互换深海矿物资源', '派遣心理疏导员'
            ]
        };

        const TEXT = {
            en: ENGLISH_CONTENT,
            zh: CHINESE_CONTENT
        };

        // ============================================================================
        // 🏭 Logic
        // ============================================================================

        const getNations = (lang) => {
          const selectedLang = (TEXT[lang]) ? lang : 'en';
          const t = TEXT[selectedLang].nations;
          return {
            bird: { ...t.bird, id: 'bird', x: 50, y: 50, color: '#be123c', npcImage: IMG_NPC_BIRD, flag: FLAG_BIRD },
            hyena: { ...t.hyena, id: 'hyena', x: 75, y: 38, color: '#854d0e', npcImage: IMG_NPC_HORSE, flag: FLAG_HYENA },
            orca: { ...t.orca, id: 'orca', x: 33, y: 35, color: '#1e3a8a', npcImage: IMG_NPC_FISH, flag: FLAG_ORCA }
          };
        };

        const getNpcPins = (lang) => {
          const selectedLang = (TEXT[lang]) ? lang : 'en';
          const t = TEXT[selectedLang].npcs || []; 
          const positions = {
            b1: { x: 50, y: 48, image: IMG_NPC_BIRD },
            b2: { x: 46, y: 52, image: IMG_NPC_BIRD },
            b3: { x: 54, y: 52, image: IMG_NPC_BIRD },

            h2: { x: 80, y: 36, image: IMG_NPC_HORSE },
