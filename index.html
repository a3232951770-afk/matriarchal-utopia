            o3: { x: 36, y: 38, image: IMG_NPC_FISH }
          };
          return t.map(n => ({ ...n, ...positions[n.id] }));
        };

        const getCouncilLogs = (lang) => {
          const selectedLang = (TEXT[lang]) ? lang : 'en';
          const t = TEXT[selectedLang].council || [];
          return t.map(c => ({ ...c, date: c.details?.split('\n')[0].split('：')[1] || '2056/06/08', nationId: 'bird' }));
        };
        
        const TRAIT_KEYS = { 'express': 'bird', 'power': 'hyena', 'memory': 'orca' };
        
        const getAbilityPresets = (lang) => {
          const selectedLang = (TEXT[lang]) ? lang : 'en';
          const t = TEXT[selectedLang].presets || {};
          return {
            'care': { ...t.care, scores: { emotion: 95, rhythm: 80, relation: 90, space: 40, scent: 85, conflict: 70 } },
            'power': { ...t.power, scores: { emotion: 40, rhythm: 60, relation: 50, space: 90, scent: 70, conflict: 95 } },
            'memory': { ...t.memory, scores: { emotion: 70, rhythm: 50, relation: 80, space: 60, scent: 95, conflict: 40 } },
            'express': { ...t.express, scores: { emotion: 90, rhythm: 95, relation: 85, space: 50, scent: 60, conflict: 30 } },
          };
        };

        // Random stats generator
        const generateRandomStats = (baseStats) => {
            if (!baseStats) return null;
            const newScores = {};
            Object.keys(baseStats.scores).forEach(key => {
                const base = baseStats.scores[key];
                const variance = Math.floor(Math.random() * 30) - 15; 
                newScores[key] = Math.max(10, Math.min(100, base + variance));
            });
            return { ...baseStats, scores: newScores };
        };

        const generateDenseRoutes = (lang) => {
          const nodes = [
            { id: 'bird', x: 200, y: 175, name: 'Plumaria' },
            { id: 'hyena', x: 300, y: 133, name: 'Riftmark' },
            { id: 'orca', x: 132, y: 122.5, name: 'Mnemos' }
          ];
          let routes = [];
          const selectedLang = (TEXT[lang]) ? lang : 'en';
          const interactions = TEXT[selectedLang].routes || [];
          const tales = ROUTE_TALES[selectedLang] || ROUTE_TALES['en'];

          for (let i = 0; i < 50; i++) {
            const start = nodes[Math.floor(Math.random() * nodes.length)];
            let end = nodes[Math.floor(Math.random() * nodes.length)];
            while (start.id === end.id) end = nodes[Math.floor(Math.random() * nodes.length)];

            const key = `${start.id}_${end.id}`;
            const stories = tales[key] || interactions;
            const story = stories[Math.floor(Math.random() * stories.length)];
            const cpX = (start.x + end.x) / 2 + (Math.random() - 0.5) * 250; 
            const cpY = (start.y + end.y) / 2 + (Math.random() - 0.5) * 250; 
            routes.push({ id: i, start, end, cpX, cpY, width: Math.random() * 2 + 1, opacity: Math.random() * 0.5 + 0.3, desc: story });
          }
          return routes;
        };

        // ============================================================================
        // 🎨 Character Creator
        // ============================================================================

        const CharacterCreator = ({ onClose, onFinish, lang, existingCharacters = [] }) => {
            const [step, setStep] = useState(1);
            const [formData, setFormData] = useState({ nation: null, gender: 'female', bodyShape: null, name: '', backstory: '', location: '' });
            const [fabricCanvas, setFabricCanvas] = useState(null);
            const [finalImage, setFinalImage] = useState(null);
            const [hoverSol, setHoverSol] = useState(false);
            const [hoverFlag, setHoverFlag] = useState(null); 
            const [isSaving, setIsSaving] = useState(false);
            
            const selectedLang = (TEXT[lang]) ? lang : 'en';
            const t = TEXT[selectedLang].ui;
            const nations = getNations(lang);

            useEffect(() => {
                if (step === 4 && !fabricCanvas) {
                    const canvas = new window.fabric.Canvas('c', { width: 320, height: 450, backgroundColor: '#dcd0bb' });
                    setFabricCanvas(canvas);
                    
                    const bodyUrl = formData.bodyShape;
                    if (bodyUrl) {
                        window.fabric.Image.fromURL(bodyUrl, (img) => {
                            if(img) {
                                const scale = 300 / img.height; 
                                img.set({
                                    scaleX: scale,
                                    scaleY: scale,
                                    left: 160, 
                                    top: 225,  
                                    originX: 'center',
                                    originY: 'center',
                                    selectable: false,
                                    opacity: 0.8
                                });
                                canvas.add(img);
                                canvas.sendToBack(img);
                            }
                        }, { crossOrigin: 'anonymous' });
                    }
                }
            }, [step]);

            const addAsset = (url) => {
                if (!fabricCanvas) return;
                window.fabric.Image.fromURL(url, (img) => {
                    img.scaleToWidth(100);
                    img.set({ left: 100, top: 100 });
                    fabricCanvas.add(img);
                    fabricCanvas.setActiveObject(img);
                }, { crossOrigin: 'anonymous' });
            };

            const handleUpload = (e) => {
                const file = e.target.files[0];
                if(!file || !fabricCanvas) return;
                const reader = new FileReader();
                reader.onload = (f) => {
                    window.fabric.Image.fromURL(f.target.result, (img) => {
                        img.scaleToWidth(100);
                        img.set({ left: 100, top: 100 });
                        fabricCanvas.add(img);
                        fabricCanvas.setActiveObject(img);
                    });
                };
                reader.readAsDataURL(file);
            };

            const deleteActiveObject = () => {
                if (!fabricCanvas) return;
                const activeObjects = fabricCanvas.getActiveObjects();
                if (activeObjects.length) {
                    fabricCanvas.discardActiveObject();
                    activeObjects.forEach((obj) => {
                        fabricCanvas.remove(obj);
                    });
                }
            };

            const moveLayer = (direction) => {
                if (!fabricCanvas) return;
                const activeObj = fabricCanvas.getActiveObject();
                if (activeObj) {
                    if (direction === 'up') activeObj.bringForward();
                    else activeObj.sendBackwards();
                    fabricCanvas.renderAll();
                }
            };
            const generatePreview = () => {
                if (fabricCanvas) {
                    const originalBg = fabricCanvas.backgroundColor;
                    fabricCanvas.setBackgroundColor(null, () => {
                        const dataURL = fabricCanvas.toDataURL({ format: 'png', quality: 1.0 });
                        setFinalImage(dataURL);
                        setStep(6);
                        fabricCanvas.setBackgroundColor(originalBg, () => fabricCanvas.renderAll());
                    });
                }
            };
            
            const saveCharacter = async () => {
                if (isSaving) return;
                setIsSaving(true);
                
                try {
                    const nationBase = nations[formData.nation];
                    let finalX, finalY;
                    
                    const obstacles = [
                        {x: nationBase.x, y: nationBase.y}, // Nation center
                        ...Object.values(nations).filter(n => n.id !== formData.nation).map(n => ({x: n.x, y: n.y})), // Other nations
                        ...(getNpcPins(lang).map(n => ({x: n.x, y: n.y}))), // NPCs
                        ...(existingCharacters || []).map(c => ({x: c.x, y: c.y})) // Existing Users
                    ];

                    let found = false;
                    // Attempt 150 times to find a non-overlapping spot
                    for(let i=0; i<150; i++) {
                        // Generate position around nation with random radius (slightly increased range)
                        const r = 8 + Math.random() * 18; 
                        const theta = Math.random() * 2 * Math.PI;
                        let tx = nationBase.x + r * Math.cos(theta);
                        let ty = nationBase.y + r * Math.sin(theta);
                        
                        // Keep within map main area (10-90%)
                        tx = Math.max(10, Math.min(90, tx));
                        ty = Math.max(10, Math.min(90, ty));

                        // Collision checking (Rectangular box)
                        // Ensure vertical distance > image height + buffer (~14%)
                        // Ensure horizontal distance > image width + buffer (~6%)
                        const SAFE_W = 6;  
                        const SAFE_H = 14; 
                        
                        let collision = false;
                        for(let obs of obstacles) {
                            const dx = Math.abs(tx - obs.x);
                            const dy = Math.abs(ty - obs.y);
                            
                            // If strictly within the 'box' of another character, it's a collision
                            if(dx < SAFE_W && dy < SAFE_H) { 
                                collision = true;
                                break;
                            }
                        }
                        
                        if(!collision) {
                            finalX = tx;
                            finalY = ty;
                            found = true;
                            break;
                        }
                    }

                    if(!found) {
                        console.warn("Could not find collision-free spot, using fallback.");
                        // Fallback: wider spread if too crowded
                        let offsetX = (Math.random() - 0.5) * 30; 
                        let offsetY = (Math.random() - 0.5) * 30;
                        finalX = Math.max(10, Math.min(90, nationBase.x + offsetX));
                        finalY = Math.max(10, Math.min(90, nationBase.y + offsetY));
                    }
                    
                    const user = auth.currentUser;
                    if (!user) {
                        alert("Please wait for authentication initialization...");
                        setIsSaving(false);
                        return;
                    }

                    const charId = Date.now().toString();
                    
                    const newChar = {
                        id: charId,
                        ...formData,
                        imageUrl: finalImage,
                        nationName: nationBase.name,
                        createdAt: new Date().toISOString(),
                        userId: user.uid,
                        x: finalX,
                        y: finalY,
                    };

                    await db.collection('characters').add(newChar);
                    console.log("Character saved to Firebase.");
                    onFinish(newChar);
                } catch (err) {
                    console.error("Save error", err);
                    alert("Failed to save character. Please try again.");
                } finally {
                    setIsSaving(false);
                }
            };

            return (
                <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4 font-serif text-[#dcd0bb]">
                    <div className="w-[95vw] h-[90vh] bg-[#292524] border-2 border-[#7f1d1d] flex flex-col relative shadow-[0_0_50px_rgba(127,29,29,0.3)]">
                        <button onClick={onClose} className="absolute top-4 right-4 z-50 hover:text-white"><X/></button>
                        
                        <div className="p-4 border-b border-[#5c4a3d] bg-[#1c1917] text-center flex justify-between items-center px-8">
                            <span className="text-xs text-[#78350f] uppercase tracking-widest">Step {step} / 7</span>
                             <h2 className="text-xl font-bold tracking-widest text-[#dcd0bb]">{t.creatorTitle}</h2>
                            <div className="w-10"></div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-8 flex flex-col items-center relative">
                             {/* Flag Hover Overlay */}
                             {hoverFlag && (
                                <div className="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-[100] animate-unfold pointer-events-none">
                                    <img src={hoverFlag} className="w-[60vw] max-w-[500px] h-auto object-contain drop-shadow-[0_0_50px_rgba(0,0,0,0.8)]" />
                                </div>
                             )}

                             {step === 1 && (
                                <div className="space-y-6 text-center animate-fade-in-up">
                                    <h3 className="text-2xl text-[#78350f] font-bold">1. Choose a Nation</h3>
                                    <div className="max-w-2xl w-full bg-[#1c1917]/80 border border-[#5c4a3d] p-6 mb-8 flex flex-col md:flex-row items-center gap-6 rounded shadow-xl">
                                        <img src={IMG_NPC_SOL} className="w-24 h-32 object-contain border-2 border-[#78350f] bg-[#dcd0bb]/10 rounded" />
                                        <div className="flex-1 text-left space-y-2">
                                            <h4 className="text-[#be123c] font-bold text-lg">{t.ocGuideTitle}</h4>
                                            <div className="text-sm text-[#dcd0bb] leading-relaxed italic opacity-80">
                                                {t.ocGuideText.map((text, i) => <p key={i}>{text}</p>)}
                                            </div>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4 max-w-2xl w-full">
                                        {Object.values(nations).map(n => (
                                             <button 
                                                key={n.id} 
                                                onClick={() => { setFormData({...formData, nation: n.id}); setStep(2); setHoverFlag(null); }} 
                                                className="p-6 border border-[#5c4a3d] hover:bg-[#7f1d1d] text-left transition-all hover:border-[#fca5a5] group relative overflow-hidden flex flex-col items-start"
                                             >
                                                <div className="font-bold text-lg mb-1 group-hover:text-white relative z-10 flex items-center gap-2">
                                                    {n.name}
                                                </div>
                                                 <div className="text-xs opacity-60 group-hover:opacity-100 relative z-10">{n.desc}</div>
                                            </button>
                                         ))}
                                    </div>
                               </div>
                            )}
                            {step === 2 && (
                                <div className="space-y-8 text-center animate-fade-in-up">
                                    <h3 className="text-2xl text-[#78350f] font-bold">2. Select Form Base</h3>
                                    <div className="flex gap-8 justify-center">
                                        {['female', 'male'].map(g => (
                                             <button key={g} onClick={() => { setFormData({...formData, gender: g}); setStep(3); }} className="w-40 h-40 border border-[#5c4a3d] hover:bg-[#7f1d1d] flex items-center justify-center text-xl uppercase tracking-widest hover:border-[#fca5a5]">{t[g]}</button>
                                        ))}
                                     </div>
                                    <button onClick={() => setStep(1)} className="text-xs underline opacity-50 hover:opacity-100">Back</button>
                                </div>
                            )}
                            {step === 3 && (
                                <div className="space-y-8 text-center animate-fade-in-up">
                                    <h3 className="text-2xl text-[#78350f] font-bold">3. Select Silhouette ({formData.gender})</h3>
                                    <div className="flex flex-wrap gap-6 justify-center">
                                        {Object.entries(BODY_SHAPES[formData.gender]).map(([key, url]) => (
                                             <div key={key} onClick={() => { setFormData({...formData, bodyShape: url}); setStep(4); }} className="cursor-pointer group relative">
                                                <div className="w-32 h-48 border border-[#5c4a3d] bg-[#dcd0bb] flex items-center justify-center overflow-hidden group-hover:border-[#7f1d1d]">
                                                     <img src={url} className="h-full object-contain opacity-70 group-hover:opacity-100 transition-opacity" />
                                                 </div>
                                                <div className="mt-2 text-xs uppercase tracking-widest group-hover:text-[#be123c] text-center">{key}</div>
                                            </div>
                                        ))}
                                    </div>
                                     <button onClick={() => setStep(2)} className="text-xs underline opacity-50 hover:opacity-100">Back</button>
                                </div>
                            )}
                             {step === 4 && (
                                <div className="flex w-full h-full gap-6 animate-fade-in-up">
                                    <div className="w-1/4 min-w-[300px] border-r border-[#5c4a3d] flex flex-col h-full overflow-hidden">
                                        <div className="flex-1 overflow-y-auto custom-scrollbar pr-4">
                                            <div className="p-4 bg-[#1c1917]/90 border-b border-[#5c4a3d] mb-4 relative overflow-hidden group">
                                                <div className="absolute inset-0 border border-[#78350f] opacity-30 m-1 pointer-events-none"></div>
                                                <h4 className="text-[#78350f] font-bold text-sm mb-2 uppercase tracking-widest text-center border-b border-[#5c4a3d]/50 pb-1">Creation Guide</h4>
                                                <div className="flex gap-3 items-start relative">
                                                    <div className="relative cursor-pointer" 
                                                         onMouseEnter={() => setHoverSol(true)} 
                                                         onMouseLeave={() => setHoverSol(false)}>
                                                        <img src={IMG_NPC_SOL} className="w-16 h-24 object-contain border border-[#5c4a3d] bg-[#dcd0bb]/5 rounded flex-shrink-0" />
                                                        <div className="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center"><ZoomIn size={16} className="text-white"/></div>
                                                    </div>
                                                    <div className="text-[10px] text-[#dcd0bb] leading-relaxed italic opacity-80 space-y-1">
                                                        <p className="font-bold text-[#be123c]">{t.ocGuideTitle}</p>
                                                        {t.ocGuideText.map((text, i) => <p key={i}>{text}</p>)}
                                                    </div>
                                                </div>
                                            </div>

                                            <h3 className="font-bold mb-4 text-[#be123c] text-xl border-b border-[#5c4a3d] pb-2 pt-2">{t.collageTitle}</h3>
                                            <div className="mb-6 space-y-4 p-4 border border-dashed border-[#5c4a3d] text-center">
                                                <label className="cursor-pointer block bg-[#292524] text-[#dcd0bb] py-2 px-1 text-xs border border-[#5c4a3d] hover:bg-[#78350f]">
                                                    <span>+ Upload Image</span>
                                                    <input type="file" onChange={handleUpload} className="hidden" />
                                                </label>
                                            </div>
                                            {Object.entries(COLLAGE_ASSETS).map(([cat, urls]) => (
                                                <div key={cat} className="mb-6">
                                                    <div className="grid grid-cols-3 gap-2">
                                                        {urls.map((u, i) => (
                                                            <img key={i} src={u} onClick={() => addAsset(u)} className="w-full h-20 object-contain bg-[#dcd0bb]/10 border border-transparent hover:border-[#be123c] cursor-pointer" />
                                                        ))}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    
                                    {hoverSol && (
                                        <div className="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-[100] animate-unfold pointer-events-none">
                                            <img src={IMG_NPC_SOL} className="h-[80vh] w-auto object-contain animate-float drop-shadow-[0_0_30px_rgba(255,255,255,0.1)]" />
                                        </div>
                                    )}

                                    <div className="flex-1 flex flex-col items-center justify-center bg-[#18181b] relative">
                                        <div className="text-xs absolute top-4 opacity-50">Drag, scale, and rotate. Use buttons to layer.</div>
                                        <div className="border-[10px] border-[#292524] shadow-2xl"><canvas id="c" /></div>
                                        <div className="mt-6 flex gap-4 w-full justify-center">
                                             <button onClick={() => setStep(3)} className="px-6 py-2 border border-[#5c4a3d] hover:bg-[#292524]">Back</button>
                                            <button onClick={() => moveLayer('up')} className="px-4 py-2 bg-[#5c4a3d] hover:bg-[#78350f]"><ArrowUp/></button>
                                             <button onClick={() => moveLayer('down')} className="px-4 py-2 bg-[#5c4a3d] hover:bg-[#78350f]"><ArrowDown/></button>
                                            <button onClick={deleteActiveObject} className="px-6 py-2 border border-[#5c4a3d] hover:text-red-500 bg-[#292524] flex items-center gap-2"><Trash size={16}/> Delete</button>
                                            <button onClick={() => fabricCanvas?.clear()} className="px-6 py-2 border border-[#5c4a3d] hover:text-red-500">Reset</button>
                                            <button onClick={generatePreview} className="px-10 py-2 bg-[#7f1d1d] text-white font-bold tracking-widest hover:bg-[#9f1239] shadow-lg">FINISH</button>
                                        </div>
                                     </div>
                                </div>
                            )}
                             {step === 6 && (
                                <div className="text-center animate-fade-in-up">
                                    <h3 className="text-2xl text-[#dcd0bb] mb-6">Form Generated</h3>
                                    <img src={finalImage} className="h-64 mx-auto border-4 border-[#5c4a3d] shadow-2xl mb-8 bg-transparent" />
                                     <div className="flex gap-4 justify-center">
                                        <button onClick={() => setStep(4)} className="px-6 py-2 border border-[#5c4a3d] hover:bg-[#292524]">Edit Form</button>
                                         <button onClick={() => setStep(7)} className="px-10 py-2 bg-[#7f1d1d] text-white font-bold tracking-widest hover:bg-[#9f1239]">INJECT SOUL &rarr;</button>
                                    </div>
                                </div>
                             )}
                            {step === 7 && (
                                <div className="flex gap-8 w-full max-w-4xl animate-fade-in-up">
                                     <div className="w-1/3">
                                        <img src={finalImage} className="w-full border-4 border-[#5c4a3d] bg-transparent" />
                                    </div>
                                    <div className="flex-1 space-y-6">
                                         <div><label className="block text-sm text-[#be123c] mb-1 font-bold">Name</label><input value={formData.name} onChange={e=>setFormData({...formData, name: e.target.value})} className="w-full bg-[#1c1917] border border-[#5c4a3d] p-3 text-xl focus:border-[#be123c] outline-none text-[#dcd0bb]"/></div>
                                        <div>
                                             <label className="block text-sm text-[#be123c] mb-1 font-bold">{t.locationSelect}</label>
                                            <select value={formData.location} onChange={e=>setFormData({...formData, location: e.target.value})} className="w-full bg-[#1c1917] border border-[#5c4a3d] p-3 text-[#dcd0bb] outline-none">
                                                 <option value="">-- Choose a Region --</option>
                                                {t.locations.map(l => <option key={l} value={l}>{l}</option>)}
                                             </select>
                                        </div>
                                         <div>
                                            <label className="block text-sm text-[#be123c] mb-1 font-bold">{t.storyPrompt}</label>
                                             <textarea value={formData.backstory} onChange={e=>setFormData({...formData, backstory: e.target.value})} placeholder={t.storyPlaceholder} className="w-full h-32 bg-[#1c1917] border border-[#5c4a3d] p-3 focus:border-[#be123c] outline-none text-[#dcd0bb]"/>
                                        </div>
                                         <button onClick={saveCharacter} disabled={!formData.name || isSaving} className="w-full py-4 bg-[#7f1d1d] text-white font-bold text-xl tracking-[0.2em] hover:bg-[#9f1239] disabled:opacity-50 shadow-xl mt-4">
                                             {isSaving ? "SAVING TO ARCHIVES..." : "ENTER THE WORLD"}
                                         </button>
                                    </div>
                                </div>
                             )}
                        </div>
                    </div>
                </div>
            );
        };

        const InvitationPhase = ({ onEnter, lang }) => {
            const [isOpen, setIsOpen] = useState(false);
            const [form, setForm] = useState({ body: '', trait: '' });
            const selectedLang = (TEXT[lang]) ? lang : 'en';
            const t = TEXT[selectedLang].ui;
            return (
               <div className="fixed inset-0 bg-[#0c0a09] flex items-center justify-center font-serif overflow-hidden">
                  {!isOpen ? (
                    <div onClick={() => setIsOpen(true)} className="relative w-[300px] h-[200px] bg-[#3f2e22] cursor-pointer group hover:scale-105 transition-transform duration-500 border-t-2 border-[#5c4a3d] flex items-center justify-center shadow-[0_20px_50px_rgba(0,0,0,0.8)]">
                      <div className="w-16 h-16 rounded-full bg-[#7f1d1d] border-4 border-[#450a0a] shadow-lg flex items-center justify-center group-hover:bg-[#991b1b] transition-colors"><span className="text-[#fecaca] text-2xl font-bold italic">M</span></div>
                      <p className="absolute bottom-4 text-[#a89078] text-xs tracking-[0.3em] opacity-70 uppercase">{t.openInvite}</p>
                    </div>
                  ) : (
                     <div className="relative w-[90%] md:w-[600px] max-h-[90vh] bg-[#dcd0bb] shadow-2xl animate-unfold origin-top border-y-[12px] border-[#292524] flex flex-col p-10 custom-scrollbar overflow-y-auto" style={{ backgroundImage: 'url("https://www.transparenttextures.com/patterns/aged-paper.png")' }}>
                      <h2 className="text-2xl text-center text-[#292524] mb-8 font-bold tracking-widest border-b-2 border-[#292524] pb-4">{t.letterTitle}</h2>
                      <div className="space-y-6 text-[#292524] text-base leading-relaxed font-medium mb-8">
                         {t.letterContent.map((p, i) => <p key={i}>{p}</p>)}
                        <div className="pl-4 border-l-2 border-[#a8a29e] italic text-sm text-[#57534e] space-y-2">
                           {t.letterNations.map((p, i) => <p key={i}>{p}</p>)}
                         </div>
                        <p>{t.traitDisclaimer}</p>
                        <p>{t.traitDisclaimer2}</p>
                      </div>
                      
                      <div className="space-y-8 bg-[#292524]/5 p-8 border border-[#292524]/10 mb-8">
                         <div>
                            <label className="block text-[#78350f] font-bold text-lg mb-4">{t.identityQ}</label>
                            <div className="flex flex-wrap gap-2">
                                 {[t.female, t.male, t.nonBinary, t.undefined, t.noAnswer].map(opt => (
                                    <button key={opt} onClick={() => setForm({...form, body: opt})} className={`px-4 py-2 border ${form.body === opt ? 'bg-[#78350f] text-[#fef3c7] border-[#78350f]' : 'border-[#a8a29e] text-[#57534e]'}`}>○ {opt}</button>
                                ))}
                            </div>
                        </div>
                         <div><label className="block text-[#78350f] font-bold text-lg mb-4">{t.traitQ}</label><div className="grid grid-cols-1 gap-3">{Object.keys(t.traits).map(key => (<button key={key} onClick={() => setForm({...form, trait: key})} className={`py-3 px-4 text-left border ${form.trait === key ? 'bg-[#78350f]/10 border-[#78350f] font-bold text-[#78350f]' : 'border-transparent hover:bg-[#292524]/5'}`}>○ {t.traits[key]}</button>))}</div></div>
                      </div>
                      <div className="text-sm text-[#57534e] space-y-2 mb-8 italic">
                          <p>{t.traitDisclaimer3}</p>
                         <p>{t.traitDisclaimer4}</p>
                         <p>{t.traitDisclaimer5}</p>
                         <p>{t.traitDisclaimer6}</p>
                       </div>
                      <button onClick={() => onEnter(form.trait)} disabled={!form.body || !form.trait} className="w-full bg-[#292524] text-[#dcd0bb] py-4 text-xl tracking-[0.2em] hover:bg-[#78350f] disabled:opacity-50 font-bold">{t.enter}</button>
                    </div>
                  )}
               </div>
            );
        };

        const WorldMapPhase = ({ onGoHome, lang, userChars, onChat }) => {
            const [scale, setScale] = useState(1);
            const [position, setPosition] = useState({ x: 0, y: 0 });
            const [activeNation, setActiveNation] = useState(null);
            const [activeLog, setActiveLog] = useState(null);
            const [activeUserChar, setActiveUserChar] = useState(null);
            const [chatState, setChatState] = useState('bio'); 
            const [chatOption, setChatOption] = useState(null);

            const nations = useMemo(() => getNations(lang), [lang]);
            const npcs = useMemo(() => getNpcPins(lang), [lang]);
            const selectedLang = (TEXT[lang]) ? lang : 'en';
            const t = TEXT[selectedLang].ui;
            
            const dialogueData = activeLog ? (NPC_DIALOGUES[lang][activeLog.id] || NPC_DIALOGUES['zh'][activeLog.id]) : null;
            
            const getNationFlagForId = (id) => {
                if (!id) return null;
                if (id.startsWith('b')) return nations.bird.flag;
                if (id.startsWith('h')) return nations.hyena.flag;
                if (id.startsWith('o')) return nations.orca.flag;
                return null;
            };

            const handleStartChat = () => { setChatState('intro'); setChatOption(null); };
            const handleOptionSelect = (opt) => { setChatOption(opt); setChatState('result'); };

            return (
                <div className="relative w-full h-screen bg-[#1c1917] overflow-hidden font-serif flex items-center justify-center">
                    <div className="relative w-full h-full cursor-move transition-transform duration-300 ease-out flex items-center justify-center" style={{ transform: `scale(${scale}) translate(${position.x}px, ${position.y}px)` }} onMouseMove={(e) => { if(e.buttons === 1) setPosition(prev => ({x: prev.x + e.movementX / scale, y: prev.y + e.movementY / scale})); }}>
                         <div className="relative h-full w-full flex items-center justify-center">
                            <img src={IMG_MAP_BG} onError={(e) => { if(e.target.src !== IMG_MAP_BACKUP) { e.target.src = IMG_MAP_BACKUP; console.warn("Main map image failed, loading backup."); } }} crossOrigin="anonymous" className="max-w-full max-h-full object-contain shadow-2xl pointer-events-none" />
                            <div className="absolute inset-0">
                                 {Object.values(nations).map(n => (
                                    <div key={n.id} onClick={(e) => {e.stopPropagation(); setActiveNation(n); setActiveLog(null); setActiveUserChar(null); setChatState('bio');}} className="absolute cursor-pointer group hover:-translate-y-2 transition-transform flex flex-col items-center z-30" style={{ left: `${n.x}%`, top: `${n.y}%` }}>
                                         <MapPin className="text-[#7f1d1d] drop-shadow-xl fill-[#b91c1c] w-12 h-12" strokeWidth={1.5} />
                                        <div className="absolute -bottom-6 bg-[#292524] text-[#dcd0bb] text-[12px] px-2 rounded opacity-0 group-hover:opacity-100 whitespace-nowrap">{n.name}</div>
                                    </div>
                                ))}
                                {npcs.map(n => (
                                     <div key={n.id} onClick={(e)=>{e.stopPropagation(); setActiveLog(n); setActiveNation(null); setActiveUserChar(null); setChatState('bio');}} className="absolute w-12 h-16 -ml-6 -mt-8 cursor-pointer group hover:scale-110 transition-transform z-20" style={{ left: `${n.x}%`, top: `${n.y}%` }}>
                                        <div className="absolute inset-0 bg-white/40 blur-xl animate-pulse rounded-full opacity-50 group-hover:opacity-80"></div>
                                         <img src={n.image} className="relative w-full h-full object-contain drop-shadow-lg filter hover:brightness-110 opacity-80" />
                                    </div>
                                ))}
                                 {userChars.map(c => (
                                    <div key={c.id} onClick={(e)=>{e.stopPropagation(); setActiveUserChar(c); setActiveNation(null); setActiveLog(null); setChatState('bio');}} className="absolute w-16 h-20 -ml-8 -mt-10 cursor-pointer group hover:scale-110 transition-transform z-20" style={{ left: `${c.x}%`, top: `${c.y}%` }}>
                                         <div className="absolute -top-6 text-xs bg-[#7f1d1d] text-white px-1 rounded opacity-0 group-hover:opacity-100 whitespace-nowrap">{c.name}</div>
                                         <img src={c.imageUrl} className="w-full h-full object-contain drop-shadow-[0_0_10px_rgba(127,29,29,0.8)] filter hover:brightness-110" />
                                    </div>
                                ))}
                             </div>
                        </div>
                    </div>
                    {activeNation && (
                        <div className="absolute top-0 right-0 h-full w-[450px] z-30 animate-slide-left flex flex-col shadow-2xl bg-[#dcd0bb] border-l-4 border-[#5c4a3d]" style={{ backgroundImage: 'url("https://www.transparenttextures.com/patterns/aged-paper.png")' }}>
                            <button onClick={()=>setActiveNation(null)} className="absolute top-4 right-4 p-2 z-50 hover:bg-[#78350f] hover:text-white rounded"><X/></button>
                            {activeNation.flag && ( <img src={activeNation.flag} className={`absolute top-0 right-0 w-[350px] h-auto object-contain pointer-events-none rotate-12 mix-blend-multiply opacity-25`} /> )}
                            <div className="p-8 pt-12 border-b-2 border-[#5c4a3d]/30 bg-[#292524]/5 relative z-10">
                                <div className="flex items-center gap-3"><h2 className="text-4xl font-bold text-[#292524] tracking-widest">{activeNation.name}</h2></div>
                                <p className="text-sm text-[#78350f] font-bold mt-2">{activeNation.desc}</p>
                            </div>
                             <div className="flex-1 overflow-y-auto p-8 custom-scrollbar text-[#44403c] leading-relaxed relative z-10"><div dangerouslySetInnerHTML={{ __html: activeNation.content }} /></div>
                        </div>
                    )}
                    {activeLog && (
                        <div className="absolute bottom-12 left-1/2 -translate-x-1/2 w-[700px] animate-slide-up z-40">
                            <div className="relative z-10 bg-[#f2e6d6] border-t-4 border-[#78350f] shadow-2xl flex overflow-visible" style={{ backgroundImage: 'url("https://www.transparenttextures.com/patterns/cream-paper.png")' }}>
                                <div className="absolute inset-0 overflow-hidden rounded-lg pointer-events-none z-0">
                                    {getNationFlagForId(activeLog.id) && ( <img src={getNationFlagForId(activeLog.id)} className={`absolute top-1/2 right-10 -translate-y-1/2 h-auto opacity-20 mix-blend-multiply rotate-6 ${activeLog.id.startsWith('o') ? 'w-[250px]' : 'w-[300px]'}`} /> )}
                                </div>
                                <button onClick={()=>setActiveLog(null)} className="absolute top-2 right-2 hover:bg-[#78350f] hover:text-white rounded p-1 transition-colors z-50"><X size={18}/></button>
                                <div className="w-48 relative flex-shrink-0 -mt-12 ml-4 self-end z-20">
                                     <img src={activeLog.image} className="w-full h-auto max-h-[350px] object-contain object-bottom drop-shadow-xl pointer-events-none" style={{ marginBottom: '-2px' }} />
                                </div>
                                <div className="flex-1 p-6 pl-2 flex flex-col gap-4 relative z-10">
                                    <div className="border-b border-[#78350f]/20 pb-2 flex justify-between items-end">
                                        <div className="flex items-center gap-2"><h2 className="text-2xl font-bold text-[#292524] tracking-wider">{activeLog.name}</h2></div>
                                        {chatState === 'bio' && ( <button onClick={handleStartChat} className="flex items-center gap-1 text-xs bg-[#78350f] text-[#fef3c7] px-3 py-1 rounded font-bold hover:bg-[#991b1b] shadow-sm"><MessageSquare size={12}/> {t.chat}</button> )}
                                        {chatState !== 'bio' && ( <button onClick={()=>setChatState('bio')} className="text-xs text-[#5c4a3d] underline hover:text-[#78350f]">{t.backList}</button> )}
                                    </div>
                                    <div className="flex flex-wrap gap-2 text-xs font-mono text-[#5c4a3d]">
                                        <div className="bg-[#292524]/5 px-2 py-1 rounded border border-[#5c4a3d]/20"><span className="opacity-50 mr-1">{t.labelHeight}:</span>{activeLog.height}</div>
                                        <div className="bg-[#292524]/5 px-2 py-1 rounded border border-[#5c4a3d]/20"><span className="opacity-50 mr-1">{t.labelAge}:</span>{activeLog.age}</div>
                                        <div className="bg-[#292524]/5 px-2 py-1 rounded border border-[#5c4a3d]/20"><span className="opacity-50 mr-1">{t.labelGender}:</span>{activeLog.gender}</div>
                                        <div className="bg-[#292524]/5 px-2 py-1 rounded border border-[#5c4a3d]/20"><span className="opacity-50 mr-1">{t.labelStatus}:</span>{activeLog.relation}</div>
                                    </div>
                                    <div className="text-xs text-[#be123c] font-bold"><span className="opacity-70 text-[#292524] mr-2">[{t.labelPersonality}]</span>{activeLog.personality}</div>
                                    <div className="overflow-y-auto custom-scrollbar max-h-[150px] pr-2 min-h-[120px]">
                                        {chatState === 'bio' && ( <p className="text-[#292524] text-sm leading-relaxed font-serif italic opacity-90 animate-fade-in-up">"{activeLog.log}"</p> )}
                                        {chatState === 'intro' && dialogueData && (
                                            <div className="animate-fade-in-up space-y-4">
                                                <div className="bg-[#fffbf2]/80 border-l-4 border-[#78350f] p-3 shadow-sm"><p className="text-[#292524] font-bold text-sm italic">"{dialogueData.start}"</p></div>
                                                <div className="space-y-2">{dialogueData.options.map(opt => ( <button key={opt.id} onClick={() => handleOptionSelect(opt)} className="w-full text-left bg-[#f5f5f4] border border-[#d6d3d1] p-2 text-xs hover:bg-[#78350f] hover:text-[#fffbf2] hover:border-[#78350f] transition-all rounded shadow-sm flex items-center gap-2 group"><span className="opacity-50 group-hover:opacity-100">➤</span> {opt.text}</button> ))}</div>
                                            </div>
                                        )}
                                        {chatState === 'result' && chatOption && (
                                            <div className="animate-fade-in-up space-y-3">
                                                <p className="text-[#5c4a3d] text-xs italic border-l-2 border-[#a8a29e] pl-2 mb-2 opacity-70">{t.dialogue.you}: {chatOption.text}</p>
                                                <div className="bg-[#fffbf2]/90 border border-[#78350f]/20 p-3 rounded shadow-sm"><p className="text-[#78350f] font-bold text-sm leading-relaxed">"{chatOption.reply}"</p></div>
                                                <button onClick={() => setChatState('bio')} className="text-xs mt-2 text-[#5c4a3d] hover:text-[#78350f] border-b border-transparent hover:border-[#78350f] transition-colors pb-0.5">{t.dialogue.end}</button>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                    {activeUserChar && (
                         <div className="absolute bottom-12 left-1/2 -translate-x-1/2 w-[550px] animate-slide-up">
                            <div className="relative z-10 bg-[#f2e6d6] border-4 border-[#78350f] rounded-lg p-6 pl-36 shadow-2xl min-h-[140px] flex flex-col justify-center" style={{ backgroundImage: 'url("https://www.transparenttextures.com/patterns/cream-paper.png")' }}>
                                 <img src={activeUserChar.imageUrl} className="absolute bottom-0 left-[-20px] w-40 h-60 z-50 object-contain object-bottom pointer-events-none drop-shadow-2xl" />
                                <button onClick={()=>setActiveUserChar(null)} className="absolute top-2 right-2"><X size={16}/></button>
                                <div className="mb-2 border-b border-[#78350f]/20 pb-1 flex items-center gap-2">
                                    <span className="bg-[#78350f] text-[#fef3c7] px-3 py-0.5 rounded text-xs font-bold">{activeUserChar.name}</span>
                                    <span className="text-[10px] text-[#5c4a3d] uppercase tracking-widest">{activeUserChar.nationName}</span>
                                </div>
                                 <div className="max-h-[150px] overflow-y-auto custom-scrollbar pr-2">
                                    <p className="text-[#292524] font-serif leading-relaxed text-sm italic">{activeUserChar.backstory || "..."}</p>
                                 </div>
                            </div>
                        </div>
                    )}
                    <div className="absolute top-8 right-8 flex flex-col gap-2 z-20"><button onClick={()=>setScale(s=>s+0.2)} className="p-3 bg-[#292524] text-[#dcd0bb]"><ZoomIn/></button><button onClick={()=>setScale(s=>Math.max(0.5,s-0.2))} className="p-3 bg-[#292524] text-[#dcd0bb]"><ZoomOut/></button></div>
                    <button onClick={onGoHome} className="absolute bottom-8 right-8 w-20 h-20 rounded-full bg-[#292524] border-4 border-[#dcd0bb] shadow-2xl flex flex-col items-center justify-center text-[#dcd0bb] hover:bg-[#78350f] z-40"><Home size={28}/><span className="text-[10px] font-bold">{t.home}</span></button>
                </div>
            );
        };

        const HomeSanctuaryPhase = ({ onBackMap, userTrait, lang, myCharacters, onOpenCreator, setActiveChar }) => {
          const [activeModal, setActiveModal] = useState(null);
          const [detailLog, setDetailLog] = useState(null); 
          const [hoveredRoute, setHoveredRoute] = useState(null); 
          const [netScale, setNetScale] = useState(1);
          const [netPos, setNetPos] = useState({ x: 0, y: 0 });
          const [isDraggingNet, setIsDraggingNet] = useState(false);
          
          const userNationId = TRAIT_KEYS[userTrait] || 'bird';
          const nations = useMemo(() => getNations(lang), [lang]);
          const presets = useMemo(() => getAbilityPresets(lang), [lang]);
          const councilLogs = useMemo(() => getCouncilLogs(lang), [lang]);
          const t = TEXT[lang].ui;

          const citizenProfile = nations[userNationId];
          const baseUserStats = presets[userTrait] || presets['express']; 
          
          const [userStats, setUserStats] = useState(baseUserStats);
          useEffect(() => { setUserStats(generateRandomStats(baseUserStats)); }, []); 

          const routes = useMemo(() => generateDenseRoutes(lang), [lang]);

          return (
            <div className="w-full h-screen relative bg-[#1c1917] overflow-hidden font-serif">
              <div className="absolute inset-0">
                <img src={IMG_HOME_BG} className="w-full h-full object-cover" alt="Home" />
                <div className="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-black/30 pointer-events-none"></div>
               </div>

              {/* OC Display Bar */}
              <div className="absolute bottom-4 left-4 z-30 flex items-end gap-4 animate-fade-in-up">
                  {myCharacters.map((char) => (
                      <div key={char.id} className="group relative cursor-pointer hover:scale-110 transition-transform origin-bottom" onClick={() => setActiveChar(char)}>
                          <img src={char.imageUrl} className="h-40 w-auto object-contain drop-shadow-2xl border-2 border-transparent bg-transparent rounded-lg"/>
                          <div className="absolute -top-12 left-1/2 -translate-x-1/2 bg-[#292524]/90 text-[#dcd0bb] p-2 rounded text-xs opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap z-40 border border-[#5c4a3d]">
                              <div className="font-bold">{char.name}</div>
                              <div>{char.nationName}</div>
                          </div>
                      </div>
                  ))}
              </div>

              <button onClick={onOpenCreator} className="absolute bottom-8 right-8 z-30 bg-[#7f1d1d] text-[#dcd0bb] border-2 border-[#5c4a3d] px-6 py-3 rounded-sm font-bold shadow-xl hover:bg-[#991b1b] hover:scale-105 transition-all flex items-center gap-2 uppercase tracking-widest">
                 <UserPlus size={20}/> {t.createChar}
              </button>

              <div className="absolute inset-0 z-10">
                  <div onClick={() => setActiveModal('newspaper_bird')} className="absolute bottom-[5%] left-[5%] h-[65%] w-auto cursor-pointer group z-20">
                      <img src={IMG_NPC_BIRD} className="w-full h-full object-contain drop-shadow-2xl grayscale group-hover:grayscale-0 transition-all duration-300" />
                  </div>
                  <div className="absolute bottom-[5%] left-[30%] h-[65%] w-auto group z-20">
                      <img src={IMG_NPC_HORSE} className="w-full h-full object-contain drop-shadow-2xl grayscale group-hover:grayscale-0 transition-all duration-300" />
                  </div>
                  <div className="absolute bottom-[5%] left-[55%] h-[65%] w-auto group z-20">
                      <img src={IMG_NPC_SOL} className="w-full h-full object-contain drop-shadow-2xl grayscale group-hover:grayscale-0 transition-all duration-300" />
                  </div>
                  <div onClick={() => setActiveModal('newspaper_fish')} className="absolute bottom-[5%] right-[5%] h-[65%] w-auto cursor-pointer group z-20">
                      <img src={IMG_NPC_FISH} className="w-full h-full object-contain drop-shadow-2xl grayscale group-hover:grayscale-0 transition-all duration-300" />
                  </div>
              </div>

              <div className="absolute top-10 left-1/2 -translate-x-1/2 flex gap-4 z-20">
                {[ { id: 'module1', label: t.module1, icon: Eye }, { id: 'module2', label: t.module2, icon: Activity }, { id: 'module3', label: t.module3, icon: Heart } ].map(mod => (
                  <button key={mod.id} onClick={() => setActiveModal(mod.id)} className="bg-[#fffbf2]/90 backdrop-blur border border-[#d4c5a9] px-6 py-3 rounded-sm shadow-lg flex items-center gap-2 text-[#4a3b32] hover:bg-[#78350f] hover:text-[#fffbf2] transition-colors">
                     <mod.icon size={16} /> <span className="text-sm tracking-widest font-bold uppercase">{mod.label}</span>
                  </button>
                ))}
              </div>

              <button onClick={onBackMap} className="absolute top-10 left-10 z-20 text-[#fffbf2] hover:text-[#fecaca] flex items-center gap-2 drop-shadow-md">
                 <MapIcon size={20} /> <span className="tracking-widest text-sm uppercase">{t.backMap}</span>
              </button>

              {activeModal && activeModal !== 'newspaper_bird' && activeModal !== 'newspaper_fish' && (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4" onClick={() => { setActiveModal(null); setDetailLog(null); }}>
                   <div className="relative w-[750px] max-w-[90vw] h-[600px] max-h-[85vh] bg-[#f0e6d2] shadow-[0_0_50px_rgba(0,0,0,1)] p-12 flex flex-col items-center animate-fade-in-up border-4 border-[#5c4a3d] overflow-hidden" onClick={e => e.stopPropagation()} style={{ backgroundImage: 'url("https://www.transparenttextures.com/patterns/old-mathematics.png")', backgroundBlendMode: 'multiply' }}>
                      <button onClick={() => { setActiveModal(null); setDetailLog(null); }} className="absolute top-4 right-4 text-[#4a3b32] hover:scale-110 z-50"><X/></button>
                      <div className="w-full h-1 bg-[#4a3b32] mb-1"></div><div className="w-full h-0.5 bg-[#4a3b32] mb-6"></div>
                      {activeModal === 'module1' && (
                        <div className="w-full h-full overflow-y-auto custom-scrollbar pr-2 relative">
                           <div className="flex items-center justify-center gap-3 mb-6"><Eye size={32} className="text-[#78350f]" /><h2 className="text-2xl font-black text-[#292524] tracking-tighter">{t.perceptionTitle}</h2></div>
                          <div className="bg-[#292524]/10 p-6 rounded border border-[#5c4a3d] mb-6 relative overflow-hidden">
                            {citizenProfile.flag && ( <img src={citizenProfile.flag} className="absolute right-[-20px] bottom-[-20px] w-48 h-auto opacity-60 rotate-12 pointer-events-none mix-blend-multiply" /> )}
                            <div className="absolute top-0 right-0 bg-[#78350f] text-[#dcd0bb] px-3 py-1 text-xs font-bold">{t.identityVerified}</div>
                            <div className="flex items-center gap-4 mb-2 relative z-10"><h3 className="text-xl font-bold text-[#78350f]">{citizenProfile.name}</h3></div>
                            <p className="text-sm text-[#57534e] mb-2 relative z-10">{t.duty}: {citizenProfile.desc}</p>
                          </div>
                          <div className="space-y-4 mb-8 relative z-10">
                              {[{ k: 'emotion' }, { k: 'rhythm' }, { k: 'relation' }, { k: 'space' }, { k: 'scent' }, { k: 'conflict' }].map(attr => (
                              <div key={attr.k} className="flex items-center gap-4">
                                 <span className="w-32 text-xs font-bold text-[#4a3b32] text-right">{t.abilityLabels[attr.k]}</span>
                                <div className="flex-1 h-3 bg-[#dcd0bb] rounded-full border border-[#a8a29e] relative overflow-hidden"><div className="h-full bg-[#78350f] transition-all duration-1000 ease-out" style={{ width: `${userStats.scores[attr.k]}%` }}></div></div>
                                <span className="w-8 text-xs font-mono text-[#78350f]">{userStats.scores[attr.k]}</span>
                               </div>
                            ))}
                          </div>
                           <div className="bg-[#fffbf2] border-l-4 border-[#be123c] p-4 text-sm text-[#57534e] relative z-10">
                            <h4 className="font-bold text-[#be123c] mb-1 flex items-center gap-2"><Activity size={14}/> {t.systemAdvice}</h4>
                            <p>{t.matchText.replace('{match}', userStats.match)}</p><p className="mt-2 text-xs opacity-80">{t.altMatchText.replace('{title}', userStats.title).replace('{altMatch}', userStats.altMatch)}</p>
                           </div>
                        </div>
                      )}

                      {activeModal === 'module2' && (
                         <div className="w-full h-full flex flex-col">
                          <div className="flex items-center justify-center gap-3 mb-4 flex-shrink-0"><Activity size={32} className="text-[#78350f]" /><h2 className="text-2xl font-black text-[#292524] tracking-tighter">{t.councilTitle}</h2></div>
                          <div className="flex-1 overflow-hidden relative w-full flex flex-col">
                             {!detailLog ? (
                              <div className="h-full overflow-y-auto custom-scrollbar space-y-3 pr-2 pl-2">
                                {councilLogs.map((log) => (
                                   <div key={log.id} onClick={() => setDetailLog(log)} className="border border-[#5c4a3d]/30 bg-[#fffbf2]/50 p-4 rounded hover:bg-[#fffbf2] transition-all cursor-pointer flex justify-between items-center group">
                                    <div><div className="text-xs text-[#78350f] font-mono mb-1">{log.date}</div><h4 className="font-bold text-[#292524] text-sm group-hover:text-[#be123c]">{log.topic}</h4></div>
                                     <span className="text-xs bg-[#292524]/10 px-2 py-1 rounded text-[#57534e] flex-shrink-0 ml-2">{log.status}</span>
                                  </div>
                                ))}
                               </div>
                            ) : (
                              <div className="h-full overflow-y-auto custom-scrollbar w-full px-4 md:px-12 py-4">
                                 <button onClick={() => setDetailLog(null)} className="mb-6 text-xs flex items-center gap-2 text-[#78350f] font-bold hover:underline bg-[#fffbf2]/50 px-3 py-1 rounded w-fit">{t.backList}</button>
                                <div className="max-w-2xl mx-auto text-left">
                                  <h3 className="text-2xl font-bold text-[#292524] mb-2 leading-tight">{detailLog.topic}</h3>
                                   <div className="flex items-center gap-4 text-xs text-[#57534e] border-b-2 border-[#5c4a3d]/20 pb-4 mb-6 font-mono"><span className="font-bold">{detailLog.date}</span><span className="px-2 py-0.5 bg-[#292524] text-[#dcd0bb] rounded">{detailLog.status}</span></div>
                                  <div className="text-base text-[#44403c] leading-loose whitespace-pre-line font-serif bg-[#fffbf2]/30 p-4 rounded-lg border border-[#5c4a3d]/10">{detailLog.details}</div>
                                 </div>
                              </div>
                            )}
                           </div>
                        </div>
                      )}

                      {activeModal === 'module3' && (
                        <div className="w-full h-full flex flex-col">
                            <div className="flex items-center justify-center gap-3 mb-4"><Heart size={32} className="text-[#78350f]" /><h2 className="text-2xl font-black text-[#292524] tracking-tighter">{t.networkTitle}</h2></div>
                            <div 
                                className="relative w-full flex-1 bg-[#292524] rounded border border-[#5c4a3d] overflow-hidden flex items-center justify-center cursor-move"
                                onMouseDown={() => setIsDraggingNet(true)}
                                onMouseUp={() => setIsDraggingNet(false)}
                                onMouseLeave={() => setIsDraggingNet(false)}
                                onMouseMove={(e) => {
                                    if (isDraggingNet) {
                                        setNetPos(prev => ({ x: prev.x + e.movementX, y: prev.y + e.movementY }));
                                    }
                                }}
                            >
                                <div style={{ transform: `translate(${netPos.x}px, ${netPos.y}px) scale(${netScale})`, transition: isDraggingNet ? 'none' : 'transform 0.1s ease-out', width: '100%', height: '100%', position: 'relative' }}>
                                     <img src={IMG_MAP_BG} className="absolute inset-0 w-full h-full object-cover opacity-20 grayscale pointer-events-none" />
                                    <svg className="absolute inset-0 w-full h-full z-10 overflow-visible" viewBox="0 0 400 350">
                                       {routes.map((r) => (
                                             <g key={r.id} onMouseEnter={() => setHoveredRoute(r)} onMouseLeave={() => setHoveredRoute(null)}>
                                          <path d={`M${r.start.x},${r.start.y} Q${r.cpX},${r.cpY} ${r.end.x},${r.end.y}`} fill="none" stroke="transparent" strokeWidth={15} className="cursor-pointer" />
                                           <path d={`M${r.start.x},${r.start.y} Q${r.cpX},${r.cpY} ${r.end.x},${r.end.y}`} fill="none" stroke={hoveredRoute === r ? "#dcd0bb" : "#78350f"} strokeWidth={hoveredRoute === r ? 3 : 1.5} strokeOpacity={hoveredRoute === r ? 1 : r.opacity} className="transition-all duration-300 pointer-events-none" />
                                        </g>
                                      ))}
                                      <circle cx="200" cy="175" r="8" fill="#be123c" /> {/* Bird */}
                                      <circle cx="300" cy="133" r="8" fill="#854d0e" /> {/* Hyena */}
                                      <circle cx="132" cy="122.5" r="8" fill="#1e3a8a" /> {/* Orca */}
                                    </svg>
                                </div>
                                <div className="absolute top-4 right-4 flex flex-col gap-2 z-50">
                                    <button onClick={(e) => {e.stopPropagation(); setNetScale(s => s + 0.2)}} className="p-2 bg-[#292524] text-[#dcd0bb] border border-[#5c4a3d] hover:bg-[#78350f] shadow-lg"><ZoomIn size={20}/></button>
                                    <button onClick={(e) => {e.stopPropagation(); setNetScale(s => Math.max(0.5, s - 0.2))}} className="p-2 bg-[#292524] text-[#dcd0bb] border border-[#5c4a3d] hover:bg-[#78350f] shadow-lg"><ZoomOut size={20}/></button>
                                </div>
                                <div className="absolute top-4 left-4 text-[10px] text-[#57534e] bg-[#fffbf2]/90 px-2 py-1 rounded border border-[#d6d3d1] pointer-events-none">
                                    Drag to Pan • Zoom to Inspect
                                </div>
                                {hoveredRoute && (
                                   <div className="absolute bottom-4 left-1/2 -translate-x-1/2 bg-[#292524]/95 text-[#dcd0bb] px-4 py-3 rounded border border-[#78350f] text-sm shadow-xl animate-fade-in-up max-w-[300px] text-center z-50 pointer-events-none">
                                    <div className="font-bold text-[#fecaca] mb-1">{t.routeInfo} #{hoveredRoute.id + 2050}</div>{hoveredRoute.desc}
                                 </div>
                                 )}
                          </div>
                          <div className="mt-4 text-center text-xs text-[#57534e]">{t.networkStats.replace('{count}', routes.length)}</div>
                      </div>
                       )}
                      <div className="w-full h-0.5 bg-[#4a3b32] mt-auto mb-1"></div><div className="w-full h-1 bg-[#4a3b32]"></div>
                   </div>
                </div>
              )}

               {(activeModal === 'newspaper_bird' || activeModal === 'newspaper_fish') && (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4" onClick={() => setActiveModal(null)}>
                   <div className="relative max-w-4xl w-full max-h-[90vh] bg-[#e5e5e5] shadow-2xl animate-unfold flex flex-col" onClick={e => e.stopPropagation()}>
                      <button onClick={() => setActiveModal(null)} className="absolute top-4 right-4 z-50 bg-black text-white p-2 rounded-full hover:scale-110 transition-transform"><X/></button>
                      <div className="flex-1 w-full overflow-y-auto custom-scrollbar">
                        <img src={activeModal === 'newspaper_bird' ? IMG_NEWSPAPER_BIRD : IMG_NEWSPAPER_FISH} className="w-full h-auto block" />
                      </div>
                   </div>
                </div>
              )}
            </div>
           );
        }

        function App() {
          const [phase, setPhase] = useState('invitation');
          const [userTrait, setUserTrait] = useState(''); 
          const [lang, setLang] = useState('en'); 
          const [allCharacters, setAllCharacters] = useState([]); 
          const [currentUser, setCurrentUser] = useState(null);
          const [activeCharId, setActiveCharId] = useState(null);
          const [showCreator, setShowCreator] = useState(false); 
          
          useEffect(() => {
              const unsubscribeAuth = auth.onAuthStateChanged((user) => {
                  setCurrentUser(user);
                  if (user) {
                      const unsubscribe = db.collection('characters')
                          .onSnapshot((snapshot) => {
                              const chars = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                              setAllCharacters(chars);
                              
                              const myChars = chars.filter(c => c.userId === user.uid);
                              if (myChars.length > 0 && !activeCharId) {
                                  setActiveCharId(myChars[0].id);
                              }
                          }, (error) => {
                              console.error("Error fetching characters:", error);
                          });
                      return () => unsubscribe();
                  } else {
                      setAllCharacters([]);
                      setCurrentUser(null);
                  }
              });
              return () => unsubscribeAuth();
          }, []); // Effect runs once on mount, logic handles updates

          const handleEnterWorld = (trait) => { setUserTrait(trait); setPhase('map'); };
          const handleCharFinish = (newChar) => { 
              setActiveCharId(newChar.id); 
              setShowCreator(false); 
          };

          const myCharacters = useMemo(() => {
              if (!currentUser) return [];
              return allCharacters.filter(c => c.userId === currentUser.uid);
          }, [allCharacters, currentUser]);

          const activeCharacter = myCharacters.find(c => c.id === activeCharId) || (myCharacters.length > 0 ? myCharacters[0] : null);
          
          return (
            <div className="w-full h-screen font-serif selection:bg-[#78350f] selection:text-[#fffbf2]">
              <button onClick={() => setLang(prev => prev === 'zh' ? 'en' : 'zh')} className="fixed bottom-8 left-8 z-[100] px-4 py-2 bg-[#292524] text-[#dcd0bb] border border-[#78350f] font-serif text-xs font-bold tracking-widest hover:bg-[#78350f] hover:text-white transition-colors shadow-lg flex items-center gap-2"><Globe size={14} /> {lang === 'zh' ? 'EN' : '中'}</button>
              {phase === 'invitation' && <InvitationPhase onEnter={handleEnterWorld} lang={lang} />}
              {phase === 'map' && <WorldMapPhase onGoHome={() => setPhase('home')} lang={lang} userChars={allCharacters} />}
              {phase === 'home' && <HomeSanctuaryPhase onBackMap={() => setPhase('map')} userTrait={userTrait} lang={lang} activeChar={activeCharacter} onOpenCreator={() => setShowCreator(true)} myCharacters={myCharacters} setActiveChar={(char) => setActiveCharId(char.id)} />}
              {showCreator && <CharacterCreator lang={lang} onClose={() => setShowCreator(false)} onFinish={handleCharFinish} existingCharacters={allCharacters} />}
             </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
